<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <form action="" method="post" class="form-validasi" autocomplete="off">
        <h1>Form Validation</h1>
        <div>
            <label for="nama">Masukan nama</label>
            <input type="text" name="nama" id="nama" autofocus required minlength="4">
        </div>
        <div>
            <label for="email">Masukan email</label>
            <input type="email" name="email" id="email" >
        </div>
        <div>
            <label for="nohp">Masukan no HP</label>
            <input type="tel" name="nohp" id="nohp" required>
        </div>
        <div>
            <label for="website">Masukan website anda</label>
            <input type="url" name="website" id="website">
        </div>
        <div>
            <label for="Angka">Masukan Angka anda</label>
            <input type="number" name="Angka" id="Angka">
        </div>
        <div>
            <label for="slider">rate</label>
            <span class="awal"></span>
            <input type="range" name="slider" id="slider" min="10" max="100" step="5">
            <span class="akhir"></span>
        </div>
        <div>
            <label for="tanggal">Masukan tanggal</label>
            <input type="date" name="tanggal" id="tanggal">
        </div>
        <div>
            <label for="warna">Masukan warna</label>
            <input type="color" name="warna" id="warna">
        </div>

        <div>
            <label for="nohp2">Masukan No HP</label>
            <input type="tel" name="nohp" id="nohp2" pattern="^(\+62|62|0)8[1-9][0-9]{6,9}$"> 
        </div>

        <div>
            <button type="submit">kirim!</button>
        </div>
    </form>

    <script src="js/myscript.js"></script>
    
</body>
</html>
